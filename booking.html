<!DOCTYPE html>
<html>
<head>
    <title>Temple Ticket Booking</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }
        h2 {
            text-align: center;
        }
        form {
            background-color: #ffffff;
            padding: 20px;
            max-width: 500px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(65, 57, 57, 0.1);
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<h2>Temple Ticket Booking Form</h2>

<form action="/submit_booking" method="POST">
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" placeholder="Enter your full name" required>

    <label for="aadhaar">Aadhaar Number:</label>
    <input type="text" id="aadhaar" name="aadhaar" placeholder="Enter 12-digit Aadhaar number" maxlength="12" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Enter your email address" required>

    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" maxlength="10" required>

    <label for="ticket">Ticket Type:</label>
    <select id="ticket" name="ticket" required>
        <option value="">Select Ticket Type</option>
        <option value="free">Free Darshan</option>
        <option value="paid">Paid Darshan - ₹300</option>
        <option value="vip">VIP / Special Darshan</option>
    </select>

    <label for="date">Preferred Date:</label>
    <input type="date" id="date" name="date" required>

    <label for="quantity">Number of People:</label>
    <input type="number" id="quantity" name="quantity" min="1" max="10" required>

    <input type="submit" value="Book Ticket">
</form>

</body>
</html>
